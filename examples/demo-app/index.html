<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Frames — a near-vanilla JS framework with JSX, async components, and reactive state." />
    <title>Frames Framework Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #0a0a0f;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 3rem 1rem;
        transition: background 0.3s, color 0.3s;
      }

      body.theme-light {
        background: #f8fafc;
        color: #0f172a;
      }
      
      body.theme-light .card {
        background: #ffffff;
        border-color: #e2e8f0;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      
      body.theme-light .card:hover {
        border-color: #cbd5e1;
      }

      body.theme-light .subtitle { color: #64748b; }
      body.theme-light .counter-display { color: #0f172a; }
      body.theme-light .nav-container { background: #ffffff; border: 1px solid #e2e8f0; }

      #app {
        max-width: 640px;
        width: 100%;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.25rem;
      }

      .subtitle {
        color: #64748b;
        font-size: 0.875rem;
        margin-bottom: 2rem;
      }

      .card {
        background: #15151f;
        border: 1px solid #1e1e2e;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.25rem;
        transition: border-color 0.2s;
      }

      .card:hover {
        border-color: #2e2e4e;
      }

      .card-title {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
        margin-bottom: 1rem;
      }

      .counter-display {
        font-size: 3rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #f8fafc;
        margin-bottom: 0.25rem;
      }

      .counter-derived {
        font-size: 0.875rem;
        color: #94a3b8;
        margin-bottom: 1.25rem;
      }

      .btn-row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      button {
        font-family: inherit;
        font-size: 0.8125rem;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        padding: 0.5rem 1rem;
        cursor: pointer;
        transition: all 0.15s;
      }

      .btn-primary {
        background: #6366f1;
        color: white;
      }
      .btn-primary:hover { background: #4f46e5; }
      .btn-primary:active { transform: scale(0.97); }

      .btn-secondary {
        background: #1e293b;
        color: #94a3b8;
        border: 1px solid #334155;
      }
      .btn-secondary:hover { background: #334155; color: #e2e8f0; }

      .btn-danger {
        background: #7f1d1d;
        color: #fca5a5;
        border: 1px solid #991b1b;
      }
      .btn-danger:hover { background: #991b1b; }

      /* Todo list */
      .todo-input-row {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .todo-input {
        flex: 1;
        font-family: inherit;
        font-size: 0.875rem;
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        outline: none;
        transition: border-color 0.2s;
      }
      .todo-input:focus { border-color: #6366f1; }

      .todo-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem 0.75rem;
        background: #1e293b;
        border-radius: 8px;
        margin-bottom: 0.375rem;
        animation: slideIn 0.2s ease-out;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .todo-item .text {
        flex: 1;
        font-size: 0.875rem;
      }

      .todo-item .remove-btn {
        background: none;
        border: none;
        color: #475569;
        cursor: pointer;
        padding: 0.25rem;
        font-size: 1rem;
        line-height: 1;
        border-radius: 4px;
        transition: color 0.15s;
      }
      .todo-item .remove-btn:hover { color: #ef4444; }

      .empty-state {
        text-align: center;
        color: #475569;
        padding: 1.5rem;
        font-size: 0.875rem;
      }

      /* Async card */
      .user-profile {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        background: #1e293b;
        border-radius: 8px;
      }

      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.125rem;
        color: white;
        flex-shrink: 0;
      }

      .user-info h3 {
        font-size: 0.9375rem;
        font-weight: 600;
        margin-bottom: 0.125rem;
      }

      .user-info p {
        font-size: 0.8125rem;
        color: #64748b;
      }

      .spinner {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem;
        color: #64748b;
        font-size: 0.875rem;
      }

      .spinner-dot {
        width: 20px;
        height: 20px;
        border: 2px solid #334155;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .stats-row {
        display: flex;
        gap: 1rem;
        margin-top: 0.75rem;
      }

      .stat {
        flex: 1;
        text-align: center;
        padding: 0.75rem;
        background: #0f172a;
        border-radius: 8px;
      }

      .stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #f8fafc;
      }

      .stat-label {
        font-size: 0.6875rem;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 0.125rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app.tsx"></script>
  </body>
</html>
